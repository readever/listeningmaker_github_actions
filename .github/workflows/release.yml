name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed by softprops/action-gh-release to attach files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # arm64 runner
            plat: mac
          - os: windows-latest
            plat: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install simplestart==0.0.1.69 pocket_tts pywebview pyinstaller

      - name: Warm model cache (downloaded once, then bundled into the app)
        run: python warm_models.py

      - name: Build macOS (.app + .dmg)
        if: matrix.plat == 'mac'
        run: |
          bash build.sh
          VER="${GITHUB_REF_NAME#v}"
          [ "$VER" = "$GITHUB_REF_NAME" ] && VER="dev"
          STAGE=/tmp/lm-dmg-stage
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R dist/ListeningMaker.app "$STAGE"/
          cp "!首次打开必读.txt" "$STAGE"/
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname ListeningMaker -srcfolder "$STAGE" -ov -format UDZO \
            "dist/ListeningMaker-${VER}-mac-arm64.dmg"

      - name: Build Windows (onedir + zip)
        if: matrix.plat == 'win'
        shell: pwsh
        run: |
          powershell -File build_windows.ps1
          Compress-Archive -Path dist/ListeningMaker -DestinationPath dist/ListeningMaker-windows-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ListeningMaker-${{ matrix.plat }}
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
