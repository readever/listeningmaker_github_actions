name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed by softprops/action-gh-release to attach files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # arm64 runner
            plat: mac
          - os: windows-latest
            plat: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install simplestart==0.0.1.70 pocket_tts pywebview pyinstaller

      - name: Warm model cache (downloaded once, then bundled into the app)
        run: python warm_models.py

      - name: Build macOS (.app + .dmg)
        if: matrix.plat == 'mac'
        run: |
          bash build.sh
          VER="${GITHUB_REF_NAME#v}"
          [ "$VER" = "$GITHUB_REF_NAME" ] && VER="dev"
          STAGE=/tmp/lm-dmg-stage
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R dist/ListeningMaker.app "$STAGE"/
          cp *.txt "$STAGE"/  # 首次打开必读.txt（文件名含全角感叹号，用通配符避免编码不匹配）
          ln -s /Applications "$STAGE/Applications"
          # hdiutil occasionally fails with "Resource busy" when diskimages-helper
          # from an earlier operation (or Spotlight) still holds the folder — retry.
          for i in 1 2 3; do
            if hdiutil create -volname ListeningMaker -srcfolder "$STAGE" -ov -format UDZO \
              "dist/ListeningMaker-${VER}-mac-arm64.dmg"; then break; fi
            echo "::warning::hdiutil attempt $i failed — killing diskimages-helper and retrying"
            pkill -9 -f diskimages-helper || true
            sleep 10
            [ "$i" = 3 ] && exit 1
          done

      - name: Build Windows (onedir + zip)
        if: matrix.plat == 'win'
        shell: pwsh
        run: |
          powershell -File build_windows.ps1
          $VER = $env:GITHUB_REF_NAME
          if (-not $VER.StartsWith('v')) { $VER = 'dev' } else { $VER = $VER.Substring(1) }
          Compress-Archive -Path dist/ListeningMaker -DestinationPath "dist/ListeningMaker-$VER-windows-x64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ListeningMaker-${{ matrix.plat }}
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
